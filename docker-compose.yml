services:
  db:
    image: postgres:18-alpine
    container_name: gymfit_db
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: gymfit
      POSTGRES_PASSWORD: gymfit
      POSTGRES_DB: gymfit_local
    volumes:
      # Postgres 18 images expect a single mount at /var/lib/postgresql and
      # place PGDATA in a versioned subdirectory beneath it; the older
      # .../data mount point makes the container refuse to start.
      - gymfit_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gymfit -d gymfit_local']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  gymfit_pgdata:
